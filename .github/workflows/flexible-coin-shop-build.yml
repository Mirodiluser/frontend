name: Flexible coin shop build
on:
  push:
    branches: [feature/flexible-coin-shop]
  pull_request:
    paths: ['app/page.tsx', 'app/components/FlexibleCoinOffer.tsx', '.github/workflows/flexible-coin-shop-build.yml']
jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: 'https://tahrir-backend.onrender.com'
