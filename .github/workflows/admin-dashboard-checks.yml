name: Admin dashboard build
on:
  push:
    branches: [feature/admin-sms-payments-overview]
  pull_request:
    paths: ['app/admin/**', 'package.json', 'package-lock.json']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: 'https://tahrir-backend.onrender.com'
